<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerobic Circuit Timer</title>
<style>
:root{
  /* Layout idea: a phone held at a station. One countdown, one card saying where you are and what to do, then where you go next. Single dark theme by choice so it reads at arm's length in a gym. No web fonts so it works with no signal. */
  color-scheme: dark;
  --bg:#0f1826;
  --panel:#18243a;
  --line:#2b3b57;
  --text:#f3f6fa;
  --muted:#9aa9bf;
  --work:#ff8b3d;
  --easy:#3fd0c1;
  --move:#ffd84d;
  --display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--move);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.narrow{max-width:560px}

.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--easy);color:var(--easy)}

/* setup */
.until{background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--move);border-radius:0;padding:10px 16px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.until span{color:var(--muted);font-weight:600}
.until b{font-family:var(--display);font-weight:800;font-size:40px;font-variant-numeric:tabular-nums;line-height:1}
.goals{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px}
.goals h3{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;margin:0 0 6px;text-wrap:balance}
.goals ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;font-size:15.5px}
.setup .goals p{margin:8px 0 0;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.agerow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;font-size:14px;color:var(--muted)}
.agerow input{width:84px;flex:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:17px;color:var(--text)}
.setup h2{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;margin:6px 0 2px;text-wrap:balance}
.setup p{color:var(--muted);margin:0 0 6px;max-width:60ch}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickbtn{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:76px}
.pickbtn small{color:var(--muted);font-weight:600;letter-spacing:.08em;font-size:13px}
.pickbtn b{font-family:var(--display);font-weight:800;font-size:23px;text-transform:uppercase;line-height:1.05}
.pickbtn[aria-pressed="true"]{border-color:var(--move);background:#2a2f25}
.pickbtn[aria-pressed="true"] b{color:var(--move)}
.pickbtn.wide{grid-column:1/-1;min-height:0}
.big{background:var(--work);border:0;border-radius:16px;color:#1b1206;font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:.06em;text-transform:uppercase;padding:18px;width:100%}
.big:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.howmany{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;margin:10px 0 4px}
.howmany span{color:var(--muted);flex-basis:100%}
.howmany b{font-family:var(--display);font-weight:800;font-size:28px;white-space:nowrap;min-width:1.2em;text-align:center}
.howmany .btn{min-width:64px;font-size:19px}
.howmany .btn:disabled{opacity:.35;cursor:not-allowed}
.plan{color:var(--muted);font-size:15px;margin:0;padding-left:1.2em}

/* progress */
.bar{position:relative;display:flex;gap:2px;height:14px}
.bar i{display:block;min-width:2px;border-radius:3px;background:var(--line);opacity:.5}
.bar i.station{background:var(--work)}
.bar i.hard{background:#ff5d3d}
.bar i.change{background:var(--move)}
.bar i.prep{background:var(--easy)}
.bar i.done{opacity:.2}
.bar i.now{opacity:1}
.bar .head{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--text);border-radius:2px}

.totals{display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-6px}
.totals b{color:var(--text);font-weight:600;font-size:19px}

/* clock */
.clock{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;border-top:8px solid var(--easy);display:flex;flex-direction:column;gap:2px}
.clock.station{border-top-color:var(--work)}
.clock.hard{border-top-color:#ff5d3d}
.clock.change{border-top-color:var(--move)}
.phase{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,44px);line-height:1.05;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted)}
.count{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(96px,30vw,200px);line-height:.95}
.next{color:var(--muted)}
.next b{color:var(--text);font-weight:600}

/* my station */
.mine{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.mine .lab{color:var(--muted);font-weight:600;letter-spacing:.1em;font-size:13px;text-transform:uppercase}
.mine .kit{font-family:var(--display);font-weight:800;font-size:clamp(32px,9vw,52px);line-height:1;text-transform:uppercase;color:var(--move)}
.mine .how{color:var(--muted)}
.tips{margin:2px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:2px;font-size:17px}
.tipline{font-size:14px;margin-bottom:4px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.levels button{background:transparent;border:2px solid var(--line);border-radius:12px;padding:10px 4px;font-family:var(--display);font-weight:800;font-size:22px}
.levels button[aria-pressed="true"]{border-color:var(--text);background:var(--text);color:var(--bg)}
.mine .task{font-size:21px;font-weight:600}
.mine .state{font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,72px);line-height:1;text-transform:uppercase;font-variant-numeric:tabular-nums}
.mine .state.go{color:var(--work)}
.mine .state.off{color:var(--easy)}
.mine .then{color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.mine .then b{color:var(--text)}

/* coach grid */
.stations{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.st .n{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.08em}
.st .kit{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.3vw,30px);text-transform:uppercase;line-height:1.05}
.st .how{color:var(--muted);font-size:14px;margin-bottom:4px}
.lvrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 0 0;margin-top:6px;border-top:1px solid var(--line);font-size:15.5px}
.lvrow .l{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted)}
.lvrow .s{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;text-transform:uppercase;white-space:nowrap}
.lvrow .s.go{color:var(--work)}
.lvrow .s.off{color:var(--easy)}

.cues{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.cues ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:19px;max-width:65ch}

.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.btn{background:transparent;border:2px solid var(--line);border-radius:12px;padding:10px 8px;font-weight:600;min-height:50px}
.btn.go{background:var(--easy);border-color:var(--easy);color:#06201d;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.btn.go.paused{background:var(--work);border-color:var(--work);color:#1b1206}
.fine{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}
.fine .btn{min-height:40px;padding:6px 12px;font-size:14px}

@media (max-width:1000px){ .stations{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:480px){ .stations{grid-template-columns:1fr} }
</style>
</head>

      <button class="chip" id="home">Home</button>

  <!-- SETUP -->
  <section class="setup" id="setup">
    <div class="until" id="until" hidden><span id="untillab">Class starts in</span><b id="untilnum"></b></div>
    <div class="goals">
      <h3 id="goaltitle"></h3>
      <ul id="goallist"></ul>
      <p id="effortkey"></p>
      <p id="hrkey"></p>
      <label class="agerow" for="age">Your age, to show heart rates in beats per minute
        <input id="age" type="number" inputmode="numeric" min="10" max="90" placeholder="Age">
      </label>
    </div>
    <h2>Pick your starting station</h2>
    <p id="pickhelp"></p>
    <div class="howmany">
      <span>How many today?</span>
      <button class="btn" id="less" aria-label="One fewer person">−1</button>
      <b id="howmany">8</b>
      <button class="btn" id="more" aria-label="One more person">+1</button>
    </div>
    <p id="countnote"></p>
    <div class="picks" id="picks"></div>
    <p style="margin-top:14px"></p>
    <button class="big" id="start" disabled>Pick a station</button>
    <button class="btn" id="reset" style="width:100%;margin-top:10px">Reset</button>
    <p style="margin-top:14px">The session, <span id="plantotal"></span>:</p>
    <ol class="plan">
      <li id="planlap"></li>
      <li>Rest: 2 min</li>
      <li id="planmain"></li>
      <li id="planwater"></li>
      <li id="planhard"></li>
      <li>Cool-down: 3 min</li>
    </ol>
  </section>

  <!-- RUNNING -->
  <section id="run" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="totals"><span>Gone <b id="gone">0:00</b></span><span>To go <b id="togo">0:00</b></span></div>

    <div class="clock" id="clock">
      <div class="phase" id="phase"></div>
      <div class="sub" id="sub"></div>
      <div class="count" id="count">0:00</div>
      <div class="next">Next: <b id="next"></b></div>
    </div>

    <div class="mine" id="mine" hidden></div>
    <div class="cues" id="cues" hidden><ol id="cuelist"></ol></div>
    <div class="stations" id="stations" hidden></div>

    <div class="controls">
      <button class="btn go" id="go">Pause</button>
      <button class="btn" id="prev">Back</button>
      <button class="btn" id="skip">Skip</button>
    </div>
    <div class="fine">
      <span>Out of step with the others?</span>
      <button class="btn" id="minus" aria-label="Move my clock back one second">−1 sec</button>
      <button class="btn" id="plus" aria-label="Move my clock forward one second">+1 sec</button>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  /* ---------- THE SESSION: edit here ---------- */
  var SESSION_DATE = "Sunday 22nd November";   // shown under the title
  // shown on the home screen
  var GOAL_TITLE = "Today's goal: a bigger aerobic engine";
  var GOALS = [
    "Training: your heart and muscles to deliver and use more oxygen, and to clear lactate faster.",
    "Over the coming weeks: a stronger heart, more capillaries and mitochondria in the working muscles, quicker recovery.",
    "For rugby: recover faster between sprints, tackles and rucks, and keep your work rate and skills in the last 20 minutes."
  ];
  // effort on the Borg scale, 6 (nothing) to 20 (flat out)
  var EFFORT = {
    warm: "Borg 8 to 10: very light to light.",
    main: "Borg 12 to 14: somewhat hard. You can still talk in sentences.",
    hard: "Borg 14 to 16: hard. Short sentences only."
  };
  // rough heart rate bands to go with the Borg targets, as a percentage of maximum heart rate
  var HR = { warm:[50,60], main:[65,80], hard:[80,90] };
  var CLASS_START = new Date(2026, 10, 22, 17, 0, 0);   // year, month (0 = January, so 10 = November), day, hour, minute, second
  var T = {
    lap: 60,        // warm-up lap: seconds on each station
    lapMove: 15,    // warm-up lap: seconds to move
    rest: 120,      // rest after the warm-up lap
    station: 180,   // main circuit: seconds on each station
    change: 30,     // main circuit: seconds to change
    water: 180,
    hardOn: 90, hardOff: 60, hardRounds: 3,
    cool: 180       // cool-down, which doubles as the recovery after the last harder interval
  };
  // p = [work seconds, easy seconds] when a level is timed. on/off are the words shown.
  var ST = [
    {kit:"Rower", cues:["Legs, then body, then arms", "Back flat, chest up", "Slow on the way forward"], how:"Long, smooth strokes.",
      lv:[{t:"Steady, then easy for the last third", tailFrac:1/3},{t:"Steady, then easy for the last 30 sec", tail:30},{t:"Steady all the way"}]},
    {kit:"Sled push", cues:["Lean in, arms locked", "Short, quick steps", "Hips low, back flat"], how:"Push a length, walk back, repeat.",
      lv:[{t:"50 kg on the sled"},{t:"80 kg on the sled"},{t:"100 kg on the sled"}]},
    {kit:"SkiErg", cues:["Reach tall, then hinge", "Arms long, hips back", "Soft knees"], how:"Hinge at the hips, hands finish by your pockets.",
      lv:[{t:"30 sec on, 30 sec easy", p:[30,30]},{t:"45 sec on, 15 sec easy", p:[45,15]},{t:"Steady all the way"}]},
    {kit:"Assault bike", cues:["Sit tall", "Push and pull the handles", "Even rhythm"], how:"Arms and legs together.",
      lv:[{t:"40 sec on, 20 sec easy", p:[40,20]},{t:"50 sec on, 10 sec easy", p:[50,10]},{t:"Steady all the way"}]},
    {kit:"Curved treadmill", cues:["Short steps, land under your hips", "Stand tall, eyes up", "Step forward to speed up, back to slow"], how:"Stay in the middle of the belt.",
      lv:[{t:"Brisk walk all the way"},{t:"Jog, then walk for the last third", tailFrac:1/3, on:"Jog", off:"Walk"},{t:"Easy run all the way"}]},
    {kit:"Battle ropes", cues:["Soft knees, chest up", "Small, fast waves", "Keep breathing"], how:"Waves, then march with arms in the air. Never let go of the ropes.",
      lv:[{t:"20 sec ropes, 20 sec march", p:[20,20], on:"Ropes", off:"March"},{t:"30 sec ropes, 20 sec march", p:[30,20], on:"Ropes", off:"March"},{t:"40 sec ropes, 20 sec march", p:[40,20], on:"Ropes", off:"March"}]},
    {kit:"HIIT machine: Farmers walk", cues:["Shoulders back and down", "Grip hard, arms long", "Short, steady steps"], how:"On the incline. Walk tall, holding the weighted handles.",
      two:"Two of you here: one on the machine, one does walking lunges. Swap halfway.",
      lv:[{t:"10 kg per handle"},{t:"20 kg per handle"},{t:"25 kg per handle"}]},
    {kit:"BikeErg", cues:["Sit tall, light hands", "Smooth circles", "Knees in line with feet"], how:"Hold the cadence shown on the bike's screen.",
      two:"Two of you here: one on the BikeErg, one on the spare curved treadmill. Swap halfway.",
      lv:[{t:"About 70 rpm"},{t:"About 80 rpm"},{t:"About 90 rpm"}]}
  ];
  // attendance: 8 or fewer people still do all 8 stations.
  // 9 adds the sled pull and 10 adds bodyweight. From 11 people up, stations are shared two at a time:
  // 8 stations up to 16 people, 9 for 17 and 18, 10 for 19 and 20.
  var PULL = {kit:"Sled pull", cues:["Stay low, chest up", "Brace your middle", "Steady pulls, no jerking"], how:"Pull a length, walk back, repeat.",
      lv:[{t:"40 kg on the sled"},{t:"60 kg on the sled"},{t:"80 kg on the sled"}]};
  var BW = {kit:"Bodyweight", cues:["Heels down, knees out", "Chest up", "Land softly"], how:"Steady rhythm. Keep moving for the whole station.",
      lv:[{t:"Squats"},{t:"Lunges, alternating legs"},{t:"Burpees. Add a push-up to make it harder."}]};
  var MIN_PEOPLE = 8, MAX_PEOPLE = 20;   // 8 or fewer people still do all 8 stations
  function shared(n){ return n > 10; }
  function stationCount(n){ return n <= 8 ? 8 : n <= 10 ? n : n <= 16 ? 8 : n <= 18 ? 9 : 10; }
  function stationsFor(n){
    var k = stationCount(n), a = ST.slice(0, Math.min(k, 8));
    if(k >= 9) a.push(PULL);
    if(k >= 10) a.push(BW);
    return a;
  }
  function pat(lv, dur){
    if(lv.p) return lv.p;
    if(lv.tail) return [dur - lv.tail, lv.tail];
    if(lv.tailFrac) return [Math.round(dur*(1 - lv.tailFrac)), Math.round(dur*lv.tailFrac)];
    return null;
  }
  /* -------------------------------------------- */

  var ACT = ST, N = ST.length;
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){ var d = document.createElement(tag); if(cls) d.className = cls; if(text != null) d.textContent = text; return d; }
  function fmt(s){ s = Math.max(0, Math.ceil(s)); var m = Math.floor(s/60), x = s%60; return m+":"+(x<10?"0":"")+x; }
  function mins(s){ return s%60===0 ? (s/60)+" min" : s<60 ? s+" sec" : Math.floor(s/60)+" min "+(s%60)+" sec"; }

  // ---- build the list of blocks ----
  var phases = [], starts = [], total = 0;
  function build(){
    ACT = stationsFor(S.count);
    N = ACT.length; phases = []; starts = []; total = 0;
    // bigger groups get shorter stations so the session stays inside the hour
    var lapDur = N >= 10 ? 45 : T.lap;
    // at 10 stations: a shorter warm-up lap, changes, water and recoveries keep it inside the hour
    var ten = N >= 10;
    var stDur = T.station;
    var chDur = ten ? 25 : T.change, waterDur = ten ? 120 : T.water, offDur = ten ? 50 : T.hardOff;
    build.lap = lapDur; build.st = stDur; build.ch = chDur; build.water = waterDur; build.off = offDur;
    
    function add(o){ if(o.dur > 0) phases.push(o); }
    var i;
    // warm-up colours fade from blue to green across the lap
    var BLUE = [59,130,246], GREEN = [52,211,153], YELLOW = [255,216,77], RED = [255,77,61];
    function fade(a, b, k){
      return "rgb("+a.map(function(v, j){ return Math.round(v + (b[j]-v)*k); }).join(",")+")";
    }
    for(i=0;i<N;i++){
      var col = fade(BLUE, GREEN, N > 1 ? i/(N-1) : 1);
      add({kind:"prep", zone:"warm", lap:true, col:col, name:"Warm-up lap "+(i+1)+" of "+N, dur:lapDur, r:i, st:true, sub:EFFORT.warm+" Try the station and pick your level for the real lap."});
      add({kind:"change", col:col, name:"Move on", dur:T.lapMove, r:(i+1)%N, st:true, sub: i===N-1 ? "Back to your starting station." : "Next station."});
    }
    add({kind:"prep", name:"Rest", dur:T.rest, r:0, st:true, sub:"Drink. Be at your starting station with your level picked."});
    for(i=0;i<N;i++){
      var sc = fade(GREEN, YELLOW, N > 1 ? i/(N-1) : 1);
      add({kind:"station", zone:"main", col:sc, name:"Station "+(i+1)+" of "+N, dur:stDur, r:i, st:true, sub:EFFORT.main});
      if(i<N-1) add({kind:"change", col:sc, name:"Change stations", dur:chDur, r:i+1, st:true, sub:"Move one station on and get going."});
    }
    add({kind:"prep", name:"Water", dur:waterDur, sub:"Then get onto a machine for the harder intervals.",
      cues:["Drink","One machine each: rowers, SkiErgs, Assault bikes, BikeErg or a curved treadmill. If they are all taken, share one and swap each interval, or use a sled.","Coming up: "+T.hardRounds+" intervals of "+mins(T.hardOn)+" strong, "+mins(offDur)+" easy"]});
    for(i=0;i<T.hardRounds;i++){
      var hc = fade(YELLOW, RED, T.hardRounds > 1 ? i/(T.hardRounds-1) : 1);
      add({kind:"hard", zone:"hard", col:hc, name:"Harder interval "+(i+1)+" of "+T.hardRounds, dur:T.hardOn, sub:EFFORT.hard+" Make every interval look the same."});
      if(i < T.hardRounds-1) add({kind:"prep", name:"Recover", dur:offDur, sub:"Keep moving gently. Do not stop."});
    }
    add({kind:"prep", name:"Cool-down", dur:T.cool, sub:"Ease down gradually.",
      cues:["Keep moving, a little easier each minute","Finish at a walk","Wipe your machine down"]});
    phases.forEach(function(x){ starts.push(total); total += x.dur; });
  }

  // ---- state (kept on this phone so a reload carries on) ----
  var S = {count:8, start:-1, coach:false, level:0, on:false, running:false, base:0, at:0};
  try{
    var saved = JSON.parse(localStorage.getItem("circuit-run") || "null");
    if(saved && typeof saved === "object" && Date.now() - (saved.at||0) < 3*3600*1000) Object.assign(S, saved);
  }catch(e){}
  function save(){ try{ localStorage.setItem("circuit-run", JSON.stringify(S)); }catch(e){} }
  if(!(S.count >= MIN_PEOPLE && S.count <= MAX_PEOPLE)) S.count = 8;
  build();
  if(S.start >= N) S.start = -1;

  // each phone remembers its owner's age so the heart rate targets can be shown in beats per minute
  var age = 0;
  try{ age = parseInt(localStorage.getItem("circuit-age") || "0", 10) || 0; }catch(e){}
  function hrRange(zone){
    var r = HR[zone];
    if(age >= 10 && age <= 90){
      var max = 208 - 0.7*age, r5 = function(v){ return Math.round(v/5)*5; };
      return r5(max*r[0]/100)+" to "+r5(max*r[1]/100)+" bpm";
    }
    return r[0]+" to "+r[1]+"% of your max";
  }
  function drawHr(){
    $("hrkey").textContent = "Heart rate, rough guide. Warm-up "+hrRange("warm")+". Circuit "+hrRange("main")+". Intervals "+hrRange("hard")+".";
  }
  function t(){ return S.running ? Math.min(total, S.base + (Date.now()-S.at)/1000) : S.base; }
  function indexAt(x){ var i = phases.length-1; while(i>0 && starts[i] > x) i--; return i; }
  function jump(x){ S.base = Math.max(0, Math.min(total, x)); S.at = Date.now(); lastSec = null; save(); }
  function cycleAt(pt, e, dur){
    var cyc = pt[0]+pt[1], pos = e % cyc, work = pos < pt[0];
    return {work:work, left:Math.min(work ? pt[0]-pos : cyc-pos, dur-e)};
  }

  // ---- sound and screen ----
  var ac = null, soundOn = true;
  function audio(){ try{ if(!ac){ var AC = window.AudioContext || window.webkitAudioContext; if(AC) ac = new AC(); } if(ac && ac.state === "suspended") ac.resume(); }catch(e){} }
  function tone(freq, dur, delay, type, vol){
    if(!soundOn || !ac) return;
    try{
      var o = ac.createOscillator(), g = ac.createGain(), at = ac.currentTime + (delay||0);
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(vol || 0.3, at+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
      o.connect(g); g.connect(ac.destination); o.start(at); o.stop(at+dur+0.02);
    }catch(e){}
  }
  // 10 seconds to go: a two-note chime. 3, 2, 1: a short click. End of the block: one long beep.
  function chime(){ tone(1319, 0.9, 0, "sine", 0.5); tone(1760, 1.1, 0.18, "sine", 0.4); }
  function click(){ tone(1500, 0.04, 0, "square", 0.35); }
  function longBeep(){ tone(880, 1.1); }
  var lock = null;
  function wake(){ try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(function(l){ lock = l; }).catch(function(){}); }catch(e){} }
  document.addEventListener("visibilitychange", function(){ if(S.running && document.visibilityState === "visible") wake(); });

  // ---- setup screen ----
  function drawSetup(){
    var box = $("picks"); box.innerHTML = "";
    ACT.forEach(function(s, i){
      var b = el("button","pickbtn");
      b.appendChild(el("small","","STATION "+(i+1)));
      b.appendChild(el("b","",s.kit));
      b.setAttribute("aria-pressed", String(!S.coach && S.start === i));
      b.addEventListener("click", function(){ S.start = i; S.coach = false; lastIdx = -1; save(); drawSetup(); });
      box.appendChild(b);
    });
    var c = el("button","pickbtn wide");
    c.appendChild(el("small","","COACH"));
    c.appendChild(el("b","","Show all "+N+" stations"));
    c.setAttribute("aria-pressed", String(S.coach));
    c.addEventListener("click", function(){ S.coach = true; S.start = -1; lastIdx = -1; save(); drawSetup(); });
    box.appendChild(c);
    $("howmany").textContent = S.count <= 8 ? "8 or fewer" : String(S.count);
    $("less").disabled = S.on || S.count <= MIN_PEOPLE;
    $("more").disabled = S.on || S.count >= MAX_PEOPLE;
    var note = N+" stations";
    if(N === 9) note += ": sled pull added";
    if(N === 10) note += ": sled pull and bodyweight added";
    note += shared(S.count) ? ". Up to two people on each." : S.count <= 8 ? ". One person on each. With fewer than 8, some stations sit empty." : ". One person on each.";
    $("countnote").textContent = note+" Everyone must set the same number.";
    $("pickhelp").textContent = (shared(S.count) ? "Up to two people per station." : "One person per station.")+" Then everyone presses Start together when the coach says go.";
    $("planlap").textContent = "Warm-up lap: "+mins(build.lap)+" on every station, easy";
    $("planmain").textContent = "Main circuit: "+mins(build.st)+" on every station at your level, "+mins(build.ch)+" to change";
    $("planwater").textContent = "Water: "+mins(build.water);
    $("planhard").textContent = T.hardRounds+" harder intervals: "+mins(T.hardOn)+" strong, "+mins(build.off)+" easy";
    $("plantotal").textContent = mins(total);
    var ready = S.coach || S.start >= 0;
    $("start").disabled = !ready;
    $("start").textContent = !ready ? "Pick a station" : S.on ? "Back to session" : "Start";
  }

  var home = false;
  function show(){
    var running = S.on && !home;
    $("setup").hidden = running;
    $("run").hidden = !running;
    $("wrap").classList.toggle("narrow", !(running && S.coach));
    if(!running) drawSetup();
  }

  // ---- running screen ----
  var lastIdx = -1, lastSec = null, lastWork = null, chips = [];

  function drawBar(){
    var b = $("bar"); b.innerHTML = "";
    phases.forEach(function(ph){ var i = el("i", ph.kind); i.style.flex = ph.dur+" 1 0"; if(ph.col) i.style.background = ph.col; b.appendChild(i); });
    b.appendChild(el("div","head")).id = "head";
  }

  function myStation(ph){ return ((S.start + ph.r) % N + N) % N; }

  function drawMine(ph){
    var box = $("mine"); box.innerHTML = "";
    var show = !S.coach && ph.st;
    box.hidden = !show;
    if(!show) return;
    var s = myStation(ph), st = ACT[s];
    box.appendChild(el("div","lab",(ph.kind === "change" ? "Move to station " : "You are on station ")+(s+1)));
    box.appendChild(el("div","kit",st.kit));
    box.appendChild(el("div","how",st.how + (st.two && shared(S.count) ? " " + st.two : "")));
    if(st.cues){ var ul = el("ul","tips"); st.cues.forEach(function(c){ ul.appendChild(el("li","",c)); }); box.appendChild(ul); }
    var lv = el("div","levels");
    [0,1,2].forEach(function(l){
      var b = el("button","","Level "+(l+1));
      b.setAttribute("aria-pressed", String(S.level === l));
      b.addEventListener("click", function(){ S.level = l; save(); lastWork = null; drawMine(ph); });
      lv.appendChild(b);
    });
    box.appendChild(lv);
    box.appendChild(el("div","task",st.lv[S.level].t));
    var state = el("div","state",""); state.id = "state"; box.appendChild(state);
    var nx = phases[lastIdx+1];
    if(ph.kind !== "change"){
      var then = el("div","then","Then: ");
      then.appendChild(el("b","", nx && nx.st ? ACT[myStation(nx)].kit : nx ? nx.name : "Finished"));
      box.appendChild(then);
    }
  }

  function drawStations(ph){
    var box = $("stations"); box.innerHTML = ""; chips = [];
    box.hidden = !(S.coach && ph.st);
    if(box.hidden) return;
    ACT.forEach(function(s, i){
      var d = el("div","st");
      d.appendChild(el("div","n","STATION "+(i+1)));
      d.appendChild(el("div","kit",s.kit));
      d.appendChild(el("div","how",s.how + (s.two && shared(S.count) ? " " + s.two : "")));
      if(s.cues) d.appendChild(el("div","tipline",s.cues.join(" · ")));
      s.lv.forEach(function(lv, l){
        var row = el("div","lvrow");
        row.appendChild(el("div","l","L"+(l+1)));
        row.appendChild(el("div","",lv.t));
        var c = el("div","s",""); row.appendChild(c);
        if(lv.p || lv.tail || lv.tailFrac) chips.push({el:c, lv:lv});
        d.appendChild(row);
      });
      box.appendChild(d);
    });
  }

  function drawPhase(ph){
    $("clock").className = "clock "+ph.kind;
    $("clock").style.borderTopColor = ph.col || "";
    $("phase").textContent = ph.name;
    $("sub").textContent = (ph.sub || "") + (ph.zone ? " Heart rate about "+hrRange(ph.zone)+"." : "");
    drawMine(ph); drawStations(ph);
    $("cues").hidden = !ph.cues;
    if(ph.cues){
      var ol = $("cuelist"); ol.innerHTML = "";
      ph.cues.forEach(function(c){ ol.appendChild(el("li","",c)); });
    }
    var segs = $("bar").querySelectorAll("i");
    for(var i=0;i<segs.length;i++){
      segs[i].classList.toggle("now", i === lastIdx);
      segs[i].classList.toggle("done", i < lastIdx);
    }
    var nx = phases[lastIdx+1];
    $("next").textContent = nx ? nx.name+" ("+mins(nx.dur)+")" : "Finished";
  }

  function setGo(){
    var b = $("go"), x = t();
    b.textContent = S.running ? "Pause" : x >= total ? "Done" : "Resume";
    b.classList.toggle("paused", !S.running);
  }

  var lastUntil = "";
  function drawUntil(){
    var left = Math.ceil((CLASS_START.getTime() - Date.now())/1000), box = $("until"), txt;
    if(left > 0){
      var h = Math.floor(left/3600), m = Math.floor(left%3600/60), x = left%60;
      txt = (h > 0 ? h+":"+(m<10?"0":"") : "")+m+":"+(x<10?"0":"")+x;
    } else if(left > -3*3600){ txt = "now"; } else { txt = ""; }
    if(txt === lastUntil) return;
    lastUntil = txt;
    box.hidden = !txt;
    $("untillab").textContent = txt === "now" ? "Class time. Start on the coach's go." : "Class starts in";
    $("untilnum").textContent = txt === "now" ? "" : txt;
  }

  function frame(){
    if(!S.on || home) drawUntil();
    if(S.on){
      var x = t();
      if(S.running && x >= total){ S.running = false; S.base = total; save(); longBeep(); setGo(); }
      var idx = indexAt(Math.min(x, total-0.001));
      var ph = phases[idx], e = Math.min(ph.dur-0.001, x - starts[idx]), rem = ph.dur - (x - starts[idx]);
      if(idx !== lastIdx){
        var first = lastIdx === -1;
        lastIdx = idx; drawPhase(ph); lastSec = null; lastWork = null;
        if(S.running && !first) longBeep();
      }
      var sec = Math.ceil(rem);
      if(S.running && lastSec !== null && sec !== lastSec){
        if(sec === 10 && ph.dur >= 30) chime();
        if(sec >= 1 && sec <= 3) click();
      }
      lastSec = sec;

      $("count").textContent = x >= total ? "DONE" : fmt(rem);
      var gone = Math.floor(x);
      $("gone").textContent = fmt(gone);
      $("togo").textContent = fmt(total - gone);
      $("head").style.left = "calc("+(x/total*100)+"% - 1px)";

      if(ph.kind === "station"){
        if(S.coach){
          chips.forEach(function(c){
            var s = cycleAt(pat(c.lv, ph.dur), e, ph.dur);
            c.el.textContent = (s.work ? (c.lv.on || "Go") : (c.lv.off || "Easy"))+" "+fmt(s.left);
            c.el.className = "s "+(s.work ? "go" : "off");
          });
        } else {
          var lv = ACT[myStation(ph)].lv[S.level], se = $("state");
          var mp = pat(lv, ph.dur);
          if(se && mp){
            var m = cycleAt(mp, e, ph.dur);
            se.textContent = (m.work ? (lv.on || "Go") : (lv.off || "Easy"))+" "+fmt(m.left);
            se.className = "state "+(m.work ? "go" : "off");
            if(S.running && lastWork !== null && lastWork !== m.work){ tone(990,0.08); tone(990,0.08,0.14); }
            lastWork = m.work;
          } else if(se){ se.textContent = "Keep going"; se.className = "state go"; }
        }
      }
    }
    requestAnimationFrame(frame);
  }

  // ---- buttons ----
  $("start").addEventListener("click", function(){
    if(!(S.coach || S.start >= 0)) return;
    audio(); wake();
    if(S.on){ home = false; show(); return; }
    S.on = true; S.running = true; S.base = 0; S.at = Date.now(); lastIdx = -1; save();
    show(); setGo(); tone(880,0.3);
  });
  $("go").addEventListener("click", function(){
    audio();
    if(S.running){ S.base = t(); S.running = false; if(lock){ try{ lock.release(); }catch(e){} lock = null; } }
    else if(S.base < total){ S.at = Date.now(); S.running = true; wake(); }
    save(); setGo();
  });
  $("skip").addEventListener("click", function(){ var i = indexAt(t()); jump(i+1 < phases.length ? starts[i+1] : total); });
  $("prev").addEventListener("click", function(){ var x = t(), i = indexAt(x); jump(x - starts[i] > 3 || i === 0 ? starts[i] : starts[i-1]); });
  $("minus").addEventListener("click", function(){ jump(t() - 1); });
  $("plus").addEventListener("click", function(){ jump(t() + 1); });
  var armed = 0;
  $("reset").addEventListener("click", function(){
    if(Date.now() - armed > 3000){ armed = Date.now(); this.textContent = "Tap again to reset"; var b = this; setTimeout(function(){ b.textContent = "Reset"; }, 3000); return; }
    armed = 0; this.textContent = "Reset";
    S.on = false; S.running = false; S.base = 0; S.start = -1; S.coach = false; S.level = 0; home = false; lastIdx = -1; save(); show();
  });
  function setCount(n){
    if(S.on || n < MIN_PEOPLE || n > MAX_PEOPLE) return;
    S.count = n; build();
    if(S.start >= N) S.start = -1;
    drawBar(); lastIdx = -1; save(); drawSetup();
  }
  $("less").addEventListener("click", function(){ setCount(S.count - 1); });
  $("more").addEventListener("click", function(){ setCount(S.count + 1); });
  $("home").addEventListener("click", function(){ home = true; show(); });
  $("sound").addEventListener("click", function(){
    audio(); soundOn = !soundOn;
    this.setAttribute("aria-pressed", String(soundOn)); this.textContent = soundOn ? "Sound on" : "Sound off";
    if(soundOn) tone(880,0.15);
  });
  // a reload mid-session has no tap yet, so sound and screen lock restart on the first touch
  document.addEventListener("pointerdown", function(){ if(S.on){ audio(); if(S.running && !lock) wake(); } });

  $("date").textContent = SESSION_DATE;
  if(age) $("age").value = age;
  drawHr();
  $("age").addEventListener("input", function(){
    age = parseInt(this.value, 10) || 0;
    try{ localStorage.setItem("circuit-age", String(age)); }catch(e){}
    drawHr(); lastIdx = -1;
  });
  $("goaltitle").textContent = GOAL_TITLE;
  GOALS.forEach(function(g){ $("goallist").appendChild(el("li","",g)); });
  $("effortkey").textContent = "Effort, Borg scale 6 to 20. Warm-up 8 to 10, light. Circuit 12 to 14, somewhat hard. Intervals 14 to 16, hard.";
  drawBar(); show(); setGo();
  requestAnimationFrame(frame);

  // keeps the page available with no signal once it has been opened (only works on a real website such as GitHub Pages)
  try{ if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}
})();
</script>
</body>
</html>
